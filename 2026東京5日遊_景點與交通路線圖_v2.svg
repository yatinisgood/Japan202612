    <text x="16" y="54" fill="#0f172a" font-size="12.5" font-weight="bold">✅ 1. 機＋酒全數訂妥：長榮 TWD 37,792 ＋ 秋葉原末廣町 APA 4晚 ¥76,200</text>
    <text x="28" y="73" fill="#475569" font-size="11.5">・長榮松山直飛羽田 T3（BR192 / BR191），Day 1 週六神樂坂 11 大名店全開，Day 4 週二平日看富士山！</text>
    <text x="16" y="96" fill="#be185d" font-size="12.5" font-weight="bold">✅ 2. 小孩最期待的「澀谷＋池袋 JUMP SHOP」排在 Day 2 ＆ Day 3 先去！</text>
